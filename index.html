<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compagnon">
  <!-- Demande aux moteurs de recherche de ne pas indexer le site. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Interdit tout chargement depuis un autre site et tout envoi de données :
       l'application ne parle qu'à ses propres fichiers. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'self'">
  <title>Compagnon de quête</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="entete">
    <button id="btn-retour" class="btn-retour" hidden aria-label="Retour">‹ Parties</button>
    <h1 id="titre-vue">Compagnon de quête</h1>
  </header>

  <div id="bandeau" class="bandeau" hidden></div>

  <main id="vue" class="vue" aria-live="polite"></main>

  <nav class="onglets" aria-label="Navigation">
    <button data-vue="parties" class="actif"><span class="ico">⚔</span><span>Parties</span></button>
    <button data-vue="heros"><span class="ico">⚜</span><span>Héros</span></button>
    <button data-vue="sauvegardes"><span class="ico">⇅</span><span>Sauvegardes</span></button>
    <button data-vue="apropos"><span class="ico">⚙</span><span>Réglages</span></button>
  </nav>

  <input type="file" id="fichier-import" accept=".json,application/json" hidden>

  <script src="stockage.js"></script>
  <script src="regles.js"></script>
  <script src="ambiance.js"></script>
  <script src="portraits.js"></script>
  <script src="quete-demo.js"></script>
  <script src="plateau.js"></script>
  <script src="vue-plateau.js"></script>
  <script src="ecran-heros.js"></script>
  <script src="app.js"></script>
</body>
</html>
